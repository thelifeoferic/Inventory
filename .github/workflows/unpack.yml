name: Publish inventory source

on:
  push:
    paths:
      - inventory-source.tar.gz

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack application
        run: |
          tar -xzf inventory-source.tar.gz
          rm inventory-source.tar.gz
          rm -f .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Hotel Wren inventory site"
          git push
